services:
  coturn:
    image: coturn/coturn
    container_name: coturn-server
    command: >
      --log-file=stdout
    environment:
      - DETECT_EXTERNAL_IP=yes
      - DETECT_RELAY_IP=yes
    volumes:
      - ./coturn-data/turnserver.conf:/etc/coturn/turnserver.conf
      - ./ssl_certs/localhost.crt:/etc/turn_cert.pem
      - ./ssl_certs/localhost.key:/etc/turn_key.pem
    network_mode: host
    restart: unless-stopped

  avatarlive:
    image: avatarlive:latest
    container_name: avatarlive
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      # - UV_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
    command: >
      --config=/app/config/chat_flashhead_edge_tts.yaml
    volumes:
      - ./models:/app/models
      - ./ssl_certs:/app/ssl_certs
      - ./config:/app/config
      - ./resource:/app/resource
    ports:
      - "8282:8282"
    networks:
      - nat_network
    shm_size: "2gb"
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - coturn
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

networks:
  nat_network:
    driver: bridge
